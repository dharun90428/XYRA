<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vertical Calendar Task Manager</title>
  <style>
    /* [All your styles remain unchanged] */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #eaeaea;
      color: #333;
      transition: background-color 0.3s, color 0.3s;
    }
    body.dark {
      background-color: #121212;
      color: #f1f1f1;
    }
    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 10px;
    }
    .calendar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .calendar-header {
      text-align: center;
    }
    .calendar-grid {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      width: 100%;
      margin-top: 20px;
    }
    .day {
      padding: 12px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
      background-color: #fff;
      transition: background-color 0.3s, color 0.3s, box-shadow 0.3s;
      position: relative;
    }
    body.dark .day {
      background-color: #1c1c1c;
      border-color: #444;
    }
    .day:hover {
      background-color: #007bff;
      color: white;
    }
    body.dark .day:hover {
      background-color: #555;
    }
    .has-tasks {
      background-color: #ffeb3b;
      box-shadow: 0 0 10px rgba(255, 235, 59, 0.7);
    }
    .selected {
      background-color: #ff9800;
      color: white;
      box-shadow: 0 0 10px 3px rgba(255, 152, 0, 0.6);
    }
    body.dark .selected {
      background-color: #ff5722;
      box-shadow: 0 0 10px 3px rgba(255, 87, 34, 0.6);
    }
    .task-list {
      margin-top: 10px;
      font-size: 0.8em;
      color: #333;
    }
    body.dark .task-list {
      color: #ccc;
    }
    .task-name {
      background-color: #f9f9f9;
      border-radius: 5px;
      margin: 3px 0;
      padding: 3px;
    }
    .tasks-section {
      margin-top: 30px;
      padding: 20px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    body.dark .tasks-section {
      background-color: #1c1c1c;
    }
    #addTaskBtn {
      position: fixed;
      top: 15px;
      left: 15px;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      z-index: 1000;
    }
    body.dark #addTaskBtn {
      background-color: #555;
    }
    #modeToggle {
      position: fixed;
      top: 15px;
      right: 15px;
      padding: 10px 15px;
      border: none;
      background-color: #fff;
      color: #333;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }
    body.dark #modeToggle {
      background-color: #333;
      color: #fff;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .modal-content {
      background-color: white;
      padding: 20px;
      border-radius: 5px;
      width: 300px;
      position: relative;
    }
    .modal input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .modal button {
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .modal button:hover {
      background-color: #0056b3;
    }
    .task label.completed {
      text-decoration: line-through;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <button id="modeToggle">🌙 Dark Mode</button>
  <button id="addTaskBtn">+ Add Task</button>

  <div class="container">
    <div class="calendar-section">
      <h2 class="calendar-header" id="monthLabel">May 2025</h2>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="tasks-section">
      <h3 id="taskDateLabel">Upcoming Tasks</h3>
      <div id="taskList"></div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="taskModal" onclick="handleModalClick(event)">
    <div class="modal-content">
      <h3>Add Task</h3>
      <input type="text" id="taskName" placeholder="Task Name" />
      <input type="date" id="taskDate" />
      <button onclick="saveTask()">Save Task</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script>
    const calendarGrid = document.getElementById("calendarGrid");
    const taskList = document.getElementById("taskList");
    const taskDateLabel = document.getElementById("taskDateLabel");
    const addTaskBtn = document.getElementById("addTaskBtn");
    const taskModal = document.getElementById("taskModal");
    const taskNameInput = document.getElementById("taskName");
    const taskDateInput = document.getElementById("taskDate");
    const modeToggle = document.getElementById("modeToggle");

    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const firstDay = new Date(year, month, 1).getDay();

    let selectedDate = null;
    let tasks = JSON.parse(localStorage.getItem("tasks")) || {};
    let isDarkMode = localStorage.getItem("isDarkMode") === "true";

    function renderCalendar() {
      calendarGrid.innerHTML = "";

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "day";
        emptyCell.style.visibility = "hidden";
        calendarGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const div = document.createElement("div");
        div.className = "day";
        div.textContent = day;

        const dateKey = `${year}-${(month + 1).toString().padStart(2, "0")}-${day.toString().padStart(2, "0")}`;
        if (tasks[dateKey] && tasks[dateKey].length > 0) {
          div.classList.add("has-tasks");
        }

        if (selectedDate === dateKey) {
          div.classList.add("selected");
        }

        const taskContainer = document.createElement("div");
        taskContainer.classList.add("task-list");

        if (tasks[dateKey]) {
          tasks[dateKey].forEach(task => {
            const taskDiv = document.createElement("div");
            taskDiv.classList.add("task-name");
            taskDiv.textContent = task.name;
            taskContainer.appendChild(taskDiv);
          });
        }

        div.appendChild(taskContainer);
        div.onclick = () => selectDate(day);
        calendarGrid.appendChild(div);
      }
    }

    function selectDate(day) {
      const dateStr = `${year}-${(month + 1).toString().padStart(2, "0")}-${day.toString().padStart(2, "0")}`;
      selectedDate = selectedDate === dateStr ? null : dateStr;
      renderCalendar();
      renderTasks();
    }

    function renderTasks() {
      taskList.innerHTML = "";

      if (selectedDate && tasks[selectedDate]) {
        taskDateLabel.textContent = `Tasks for ${selectedDate}`;
        tasks[selectedDate].forEach((task, index) => {
          const div = document.createElement("div");
          div.className = "task";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.id = `task-${selectedDate}-${index}`;
          checkbox.checked = task.completed;
          checkbox.onchange = () => {
            task.completed = checkbox.checked;
            localStorage.setItem("tasks", JSON.stringify(tasks));
            renderTasks();
          };

          const label = document.createElement("label");
          label.htmlFor = checkbox.id;
          label.className = task.completed ? "completed" : "";
          label.innerHTML = `<strong>${task.name}</strong><br>Due: ${task.due}`;

          div.appendChild(checkbox);
          div.appendChild(label);
          taskList.appendChild(div);
        });
      } else {
        taskDateLabel.textContent = "All Tasks";
        const dates = Object.keys(tasks).sort();
        if (dates.length === 0) {
          taskList.innerHTML = "<p>No tasks found.</p>";
          return;
        }

        dates.forEach(date => {
          tasks[date].forEach((task, index) => {
            const div = document.createElement("div");
            div.className = "task";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.id = `task-${date}-${index}`;
            checkbox.checked = task.completed;
            checkbox.onchange = () => {
              task.completed = checkbox.checked;
              localStorage.setItem("tasks", JSON.stringify(tasks));
              renderTasks();
            };

            const label = document.createElement("label");
            label.htmlFor = checkbox.id;
            label.className = task.completed ? "completed" : "";
            label.innerHTML = `<strong>${task.name}</strong><br>Due: ${task.due}`;

            div.appendChild(checkbox);
            div.appendChild(label);
            taskList.appendChild(div);
          });
        });
      }
    }

    addTaskBtn.onclick = () => {
      taskModal.style.display = "flex";
      taskNameInput.value = "";
      taskDateInput.value = selectedDate || "";
    };

    function closeModal() {
      taskModal.style.display = "none";
    }

    function handleModalClick(event) {
      if (event.target === taskModal) {
        closeModal();
      }
    }

    function saveTask() {
      const name = taskNameInput.value.trim();
      const date = taskDateInput.value;

      if (!name || !date) {
        alert("Please enter both task name and date.");
        return;
      }

      if (!tasks[date]) tasks[date] = [];
      tasks[date].push({ name, due: date, completed: false });

      localStorage.setItem("tasks", JSON.stringify(tasks));
      if (selectedDate === date) renderTasks();
      renderCalendar();
      closeModal();
    }

    modeToggle.onclick = () => {
      isDarkMode = !isDarkMode;
      document.body.classList.toggle("dark", isDarkMode);
      modeToggle.textContent = isDarkMode ? "☀️ Light Mode" : "🌙 Dark Mode";
      localStorage.setItem("isDarkMode", isDarkMode);
    };

    // Initialize theme based on localStorage value
    if (isDarkMode) {
      document.body.classList.add("dark");
      modeToggle.textContent = "☀️ Light Mode";
    } else {
      modeToggle.textContent = "🌙 Dark Mode";
    }

    renderCalendar();
    renderTasks(); // <-- ensure tasks render on page load
  </script>
</body>
</html>
