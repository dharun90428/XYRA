<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ultimate Productivity Website</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    body.dark-mode {
      background-color: #121212;
      color: #f1f1f1;
    }

    .container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      background-color: #007bff;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      flex-wrap: wrap;
    }

    .task-container, .pomodoro-container, .goal-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      margin: 20px;
    }

    body.dark-mode .task-container,
    body.dark-mode .pomodoro-container,
    body.dark-mode .goal-container {
      background-color: #1f1f1f;
      color: #f1f1f1;
    }

    .task-container h3, .pomodoro-container h3, .goal-container h3 {
      text-align: center;
    }

    .btn {
      width: 100%;
      margin-top: 10px;
    }

    .task-list {
      list-style: none;
      padding: 0;
    }

    .task-list li {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
    }

    .task-list li button {
      margin-left: 10px;
    }

    .pomodoro-timer {
      text-align: center;
    }

    /* Dark Mode Toggle */
    #toggle-container {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1000;
    }

    #toggle-dark {
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 50%;
      padding: 8px 10px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    #toggle-dark:hover {
      background-color: #f0f0f0;
    }

    body.dark-mode #toggle-dark {
      background-color: #333;
      color: #fff;
      border: 1px solid #888;
    }
  </style>
</head>
<body>

<!-- Dark Mode Toggle Button -->
<div id="toggle-container">
  <button id="toggle-dark">🌙</button>
</div>

<div class="container">
  <div class="header">
    <h1>Ultimate Productivity Website</h1>
    <p>Your one-stop tool for managing tasks, Pomodoro sessions, and goals</p>
  </div>

  <div class="content">
    <!-- Task Section -->
    <div class="task-container">
      <h3>Task Manager</h3>
      <ul id="task-list" class="task-list"></ul>
      <input type="text" id="task-input" class="form-control" placeholder="Enter a task">
      <button class="btn btn-primary" id="add-task">Add Task</button>
    </div>

    <!-- Pomodoro Section -->
    <div class="pomodoro-container">
      <h3>Pomodoro Timer</h3>
      <div id="pomodoro-timer" class="pomodoro-timer">
        <h4>00:00</h4>
        <button class="btn btn-success" id="start-timer">Start Timer</button>
        <button class="btn btn-danger" id="stop-timer">Stop Timer</button>
      </div>
    </div>
  </div>

  <div class="content">
    <!-- Goal Section -->
    <div class="goal-container">
      <h3>Goal Setting</h3>
      <input type="text" id="goal-input" class="form-control" placeholder="Enter your goal">
      <button class="btn btn-success" id="add-goal">Set Goal</button>
      <ul id="goal-list" class="task-list"></ul>
    </div>
  </div>
</div>

<script>
  // Task Logic
  let taskList = JSON.parse(localStorage.getItem('tasks')) || [];

  function renderTasks() {
    const taskListElement = document.getElementById('task-list');
    taskListElement.innerHTML = '';
    taskList.forEach((task, index) => {
      const li = document.createElement('li');
      li.innerHTML = `${task} <button class="btn btn-danger btn-sm" onclick="deleteTask(${index})">Delete</button>`;
      taskListElement.appendChild(li);
    });
  }

  function deleteTask(index) {
    taskList.splice(index, 1);
    localStorage.setItem('tasks', JSON.stringify(taskList));
    renderTasks();
  }

  document.getElementById('add-task').addEventListener('click', () => {
    const taskInput = document.getElementById('task-input');
    const task = taskInput.value.trim();
    if (task) {
      taskList.push(task);
      localStorage.setItem('tasks', JSON.stringify(taskList));
      taskInput.value = '';
      renderTasks();
    }
  });

  // Pomodoro Timer Logic
  let timer;
  let isRunning = false;
  let timeLeft = 25 * 60;

  function startPomodoro() {
    if (!isRunning) {
      isRunning = true;
      timer = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(timer);
          alert('Pomodoro session completed!');
          timeLeft = 25 * 60;
        } else {
          timeLeft--;
          const minutes = Math.floor(timeLeft / 60);
          const seconds = timeLeft % 60;
          document.getElementById('pomodoro-timer').children[0].innerHTML =
            `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
      }, 1000);
    }
  }

  document.getElementById('start-timer').addEventListener('click', startPomodoro);
  document.getElementById('stop-timer').addEventListener('click', () => {
    clearInterval(timer);
    isRunning = false;
    timeLeft = 25 * 60;
    document.getElementById('pomodoro-timer').children[0].innerHTML = '00:00';
  });

  // Goal Logic
  let goalList = JSON.parse(localStorage.getItem('goals')) || [];

  function renderGoals() {
    const goalListElement = document.getElementById('goal-list');
    goalListElement.innerHTML = '';
    goalList.forEach((goal) => {
      const li = document.createElement('li');
      li.innerHTML = goal;
      goalListElement.appendChild(li);
    });
  }

  document.getElementById('add-goal').addEventListener('click', () => {
    const goalInput = document.getElementById('goal-input');
    const goal = goalInput.value.trim();
    if (goal) {
      goalList.push(goal);
      localStorage.setItem('goals', JSON.stringify(goalList));
      goalInput.value = '';
      renderGoals();
    }
  });

  // Dark Mode Toggle
  const toggleBtn = document.getElementById('toggle-dark');
  toggleBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    toggleBtn.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
  });

  // Initial render
  renderTasks();
  renderGoals();
</script>

</body>
</html>
