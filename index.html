<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vertical Calendar Task Manager</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #eaeaea;
      color: #333;
      transition: background-color 0.3s, color 0.3s;
    }

    body.dark {
      background-color: #121212;
      color: #f1f1f1;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 10px;
    }

    .calendar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .calendar-header {
      text-align: center;
    }

    .calendar-grid {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      width: 100%;
      margin-top: 20px;
    }

    .day {
      padding: 12px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
      background-color: #fff;
      transition: background-color 0.3s, color 0.3s, box-shadow 0.3s;
      position: relative;
    }

    body.dark .day {
      background-color: #1c1c1c;
      border-color: #444;
    }

    .day:hover {
      background-color: #007bff;
      color: white;
    }

    body.dark .day:hover {
      background-color: #555;
    }

    .has-tasks {
      background-color: #ffeb3b;
      box-shadow: 0 0 10px rgba(255, 235, 59, 0.7);
    }

    .selected {
      background-color: #ff9800;
      color: white;
      box-shadow: 0 0 10px 3px rgba(255, 152, 0, 0.6);
    }

    body.dark .selected {
      background-color: #ff5722;
      box-shadow: 0 0 10px 3px rgba(255, 87, 34, 0.6);
    }

    .task-list {
      margin-top: 10px;
      font-size: 0.8em;
      color: #333;
    }

    .task-name {
      background-color: #f9f9f9;
      border-radius: 5px;
      margin: 3px 0;
      padding: 3px;
    }

    .tasks-section {
      margin-top: 30px;
      padding: 20px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    body.dark .tasks-section {
      background-color: #1c1c1c;
    }

    #addTaskBtn {
      position: fixed;
      top: 15px;
      left: 15px;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    body.dark #addTaskBtn {
      background-color: #555;
    }

    #modeToggle {
      position: fixed;
      top: 15px;
      right: 15px;
      padding: 10px 15px;
      border: none;
      background-color: #fff;
      color: #333;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
      z-index: 999;
    }

    body.dark #modeToggle {
      background-color: #333;
      color: #fff;
    }

    .empty-state {
      text-align: center;
      font-size: 1.2em;
      color: #777;
      margin-top: 20px;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background-color: white;
      padding: 20px;
      border-radius: 5px;
      width: 300px;
    }

    .modal input,
    .modal select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .modal button {
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .modal button:hover {
      background-color: #0056b3;
    }

  </style>
</head>
<body>
  <button id="modeToggle">🌙 Dark Mode</button>
  <button id="addTaskBtn">+ Add Task</button>

  <div class="container">
    <div class="calendar-section">
      <h2 class="calendar-header" id="monthLabel">May 2025</h2>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="tasks-section">
      <h3 id="taskDateLabel">Upcoming Tasks</h3>
      <div id="taskList"></div>
    </div>
  </div>

  <!-- Modal for adding task -->
  <div class="modal" id="taskModal">
    <div class="modal-content">
      <h3>Add Task</h3>
      <input type="text" id="taskName" placeholder="Task Name" />
      <input type="date" id="taskDate" />
      <button onclick="saveTask()">Save Task</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script>
    const calendarGrid = document.getElementById("calendarGrid");
    const taskList = document.getElementById("taskList");
    const taskDateLabel = document.getElementById("taskDateLabel");
    const addTaskBtn = document.getElementById("addTaskBtn");

    const taskModal = document.getElementById("taskModal");
    const taskNameInput = document.getElementById("taskName");
    const taskDateInput = document.getElementById("taskDate");

    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const firstDay = new Date(year, month, 1).getDay();

    let selectedDate = null;
    let tasks = JSON.parse(localStorage.getItem("tasks")) || {};

    function renderCalendar() {
      calendarGrid.innerHTML = "";

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "day";
        emptyCell.style.visibility = "hidden";
        calendarGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const div = document.createElement("div");
        div.className = "day";
        div.textContent = day;

        const dateKey = `${year}-${(month + 1).toString().padStart(2, "0")}-${day.toString().padStart(2, "0")}`;
        if (tasks[dateKey] && tasks[dateKey].length > 0) {
          div.classList.add("has-tasks");
        }

        if (selectedDate === dateKey) {
          div.classList.add("selected");
        }

        // Task names under each date
        const taskContainer = document.createElement("div");
        taskContainer.classList.add("task-list");

        if (tasks[dateKey]) {
          tasks[dateKey].forEach(task => {
            const taskDiv = document.createElement("div");
            taskDiv.classList.add("task-name");
            taskDiv.textContent = task.name;
            taskContainer.appendChild(taskDiv);
          });
        }

        div.appendChild(taskContainer);

        div.onclick = () => selectDate(day);
        calendarGrid.appendChild(div);
      }
    }

    function selectDate(day) {
      const selectedDay = `${year}-${(month + 1).toString().padStart(2, "0")}-${day.toString().padStart(2, "0")}`;
      if (selectedDate === selectedDay) {
        selectedDate = null;
        taskDateLabel.textContent = "Upcoming Tasks";
      } else {
        selectedDate = selectedDay;
        taskDateLabel.textContent = `Tasks for ${selectedDate}`;
      }
      renderTasks();
      renderCalendar();
    }

    function renderTasks() {
      taskList.innerHTML = "";
      if (selectedDate) {
        const taskArray = tasks[selectedDate] || [];
        if (taskArray.length > 0) {
          taskArray.forEach((task, index) => {
            const div = document.createElement("div");
            div.className = "task";
            div.innerHTML = ` 
              <input type="checkbox" id="task${index}">
              <label for="task${index}"><strong>${task.name}</strong><br>Due: ${task.due}</label>
            `;
            taskList.appendChild(div);
          });
        } else {
          taskList.innerHTML = `<p>No tasks for this date.</p>`;
        }
      }
    }

    addTaskBtn.onclick = () => {
      taskModal.style.display = 'flex';
    };

    function closeModal() {
      taskModal.style.display = 'none';
    }

    function saveTask() {
      const name = taskNameInput.value;
      const date = taskDateInput.value;

      if (!name || !date) {
        alert("Please enter both task name and date.");
        return;
      }

      if (!tasks[date]) tasks[date] = [];
      tasks[date].push({ name, due: date, completed: false });

      localStorage.setItem("tasks", JSON.stringify(tasks));
      renderTasks();
      renderCalendar();
      closeModal();
    }

    modeToggle.onclick = () => {
      document.body.classList.toggle("dark");
      modeToggle.textContent = document.body.classList.contains("dark") ? "☀️ Light Mode" : "🌙 Dark Mode";
    };

    renderCalendar();
  </script>
</body>
</html>
