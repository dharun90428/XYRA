<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendar Task Manager</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      transition: background-color 0.3s, color 0.3s;
      background-color: #eaeaea;
      color: #333;
    }

    body.dark {
      background-color: #121212;
      color: #f1f1f1;
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: flex;
      height: 600px;
      background-color: #fff;
    }

    body.dark .container {
      background-color: #1c1c1c;
    }

    .calendar, .sidebar {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .calendar {
      border-right: 1px solid #ccc;
    }

    body.dark .calendar {
      border-color: #333;
    }

    .calendar h2 {
      margin-top: 0;
      text-align: center;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .day {
      padding: 10px;
      text-align: center;
      border: 1px solid #ccc;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s, color 0.3s;
    }

    .day:hover {
      background-color: #007bff;
      color: white;
    }

    body.dark .day:hover {
      background-color: #555;
    }

    .sidebar h3 {
      margin-top: 0;
    }

    .task {
      margin: 10px 0;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 5px;
      border: 1px solid #ddd;
    }

    body.dark .task {
      background-color: #333;
      border-color: #555;
    }

    #addTaskBtn {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    body.dark #addTaskBtn {
      background-color: #555;
    }

    /* Toggle button */
    #modeToggle {
      position: fixed;
      top: 15px;
      right: 15px;
      padding: 10px 15px;
      border: none;
      background-color: #fff;
      color: #333;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
      z-index: 999;
      transition: background-color 0.3s, color 0.3s;
    }

    body.dark #modeToggle {
      background-color: #333;
      color: #fff;
    }
  </style>
</head>
<body>
  <button id="modeToggle">🌙 Dark Mode</button>

  <div class="container">
    <div class="calendar">
      <h2 id="monthLabel">May 2025</h2>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="sidebar">
      <h3 id="taskDateLabel">Select a date</h3>
      <div id="taskList"></div>
      <button id="addTaskBtn">Add Task</button>
    </div>
  </div>

  <script>
    const calendarGrid = document.getElementById("calendarGrid");
    const monthLabel = document.getElementById("monthLabel");
    const taskList = document.getElementById("taskList");
    const taskDateLabel = document.getElementById("taskDateLabel");
    const addTaskBtn = document.getElementById("addTaskBtn");
    const modeToggle = document.getElementById("modeToggle");

    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    let selectedDate = null;
    let tasks = JSON.parse(localStorage.getItem("tasks")) || {};

    function renderCalendar() {
      calendarGrid.innerHTML = "";
      for (let day = 1; day <= daysInMonth; day++) {
        const div = document.createElement("div");
        div.className = "day";
        div.textContent = day;
        div.onclick = () => selectDate(day);
        calendarGrid.appendChild(div);
      }
    }

    function selectDate(day) {
      selectedDate = `${year}-${(month+1).toString().padStart(2, "0")}-${day.toString().padStart(2, "0")}`;
      taskDateLabel.textContent = `Tasks for ${selectedDate}`;
      renderTasks();
    }

    function renderTasks() {
      taskList.innerHTML = "";
      const taskArray = tasks[selectedDate] || [];
      taskArray.forEach(task => {
        const div = document.createElement("div");
        div.className = "task";
        div.innerHTML = `<strong>${task.name}</strong><br>Due: ${task.due}`;
        taskList.appendChild(div);
      });
    }

    addTaskBtn.onclick = () => {
      if (!selectedDate) {
        alert("Please select a date first.");
        return;
      }

      const name = prompt("Task name:");
      if (!name) return;

      const due = prompt("Due date (YYYY-MM-DD):", selectedDate);
      if (!due) return;

      if (!tasks[selectedDate]) tasks[selectedDate] = [];
      tasks[selectedDate].push({ name, due });

      localStorage.setItem("tasks", JSON.stringify(tasks));
      renderTasks();
    };

    modeToggle.onclick = () => {
      document.body.classList.toggle("dark");
      modeToggle.textContent = document.body.classList.contains("dark") ? "☀️ Light Mode" : "🌙 Dark Mode";
    };

    renderCalendar();
  </script>
</body>
</html>
